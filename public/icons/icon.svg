<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded squircles for modern app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3"/>
  
  <!-- Subtle background glow -->
  <circle cx="256" cy="240" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Central Beam & Pillar -->
  <g filter="url(#glow)">
    <!-- Base -->
    <path d="M180 400 L332 400 Q332 388 320 384 L276 380 L276 150 L236 150 L236 380 L192 384 Q180 388 180 400 Z" fill="url(#accent)"/>
    <!-- Central Pivot Top -->
    <circle cx="256" cy="130" r="18" fill="url(#gold)"/>
    <circle cx="256" cy="130" r="8" fill="#0f172a"/>
    <!-- Balance Beam -->
    <path d="M120 160 Q256 142 392 160 Q256 150 120 160 Z" fill="url(#accent)"/>
    <!-- Strings Left -->
    <line x1="126" y1="160" x2="86" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="126" y1="160" x2="166" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Pan Left -->
    <path d="M70 250 Q126 290 182 250 Z" fill="url(#accent)"/>
    <!-- Strings Right -->
    <line x1="386" y1="160" x2="346" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="386" y1="160" x2="426" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Pan Right -->
    <path d="M330 250 Q386 290 442 250 Z" fill="url(#accent)"/>
  </g>
  
  <!-- Star mark in bottom center representing Cameroon -->
  <path d="M256 340 L260 352 L272 352 L262 360 L266 372 L256 364 L246 372 L250 360 L240 352 L252 352 Z" fill="url(#gold)"/>
</svg>
